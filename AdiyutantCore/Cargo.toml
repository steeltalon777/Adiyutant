[workspace]
resolver = "2"
members = [
    "adiyutant_core",
    "adiyutant_store",
    "adiyutant_cli",
]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
